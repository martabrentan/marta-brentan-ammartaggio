---
layout: default
---

<section class="py-5">
  <div class="container">

    <h1 class="fw-bold mb-3">{{ page.title }}</h1>

    <p class="text-muted mb-4">
      {{ page.date | date: "%d %B %Y" }}
    </p>

    {% if page.image %}
    <img src="{{ page.image }}" alt="{{ page.title }}" class="img-fluid rounded-3 mb-4" style="max-height: 350px; object-fit: cover;">
    {% endif %}

    <article class="blog-content">
      {{ content }}
    </article>

  </div>
</section>
