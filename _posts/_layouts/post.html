---
layout: default
---

<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>{{ page.title }}</title>
  <link rel="stylesheet" href="/assets/css/main.css">
</head>

<body>

  {% include header.html %}

  <main class="container py-5 post-content">

    <h1 class="mb-4">{{ page.title }}</h1>

    {% if page.date %}
      <p class="text-muted mb-4">
        {{ page.date | date: "%d %B %Y" }}
      </p>
    {% endif %}

    {{ content }}

    <a href="/blog" class="btn btn-primary mt-5">← Torna al blog</a>

  </main>

  {% include footer.html %}
  
</body>
</html>
