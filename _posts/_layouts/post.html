<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>{{ page.title }} – Marta Brentan</title>

  <link rel="stylesheet" href="/assets/css/main.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

  {% include header.html %}

  <main class="container py-5 post-layout">

    <div class="post-header mb-4">
      <h1 class="fw-bold">{{ page.title }}</h1>
      {% if page.date %}
      <p class="text-muted">{{ page.date | date: "%d %B %Y" }}</p>
      {% endif %}
    </div>

    {% if page.image %}
    <img src="{{ page.image }}" alt="{{ page.title }}" class="post-image rounded-4 mb-4">
    {% endif %}

    <article class="post-content">
      {{ content }}
    </article>

    <a href="/blog" class="btn btn-primary mt-4">← Torna al blog</a>

  </main>

  {% include footer.html %}

</body>
</html>
