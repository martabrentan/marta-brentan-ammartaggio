---
layout: default
title: Blog
---

<h1>Blog</h1>
<p>Non giudico mai un libro dalla sua copertina, specie quando è bellissima.</p>

<div class="blog-list">
  {% for post in site.posts %}
    <article class="blog-item">

      {% if post.image %}
        <img src="{{ post.image }}" alt="{{ post.title }}">
      {% endif %}

      <h2>{{ post.title }}</h2>

      <p class="date">{{ post.date | date: "%d %B %Y" }}</p>
      <p class="category">{{ post.category }}</p>

      <a href="{{ post.url }}" class="btn btn-primary">Leggi l’articolo</a>

    </article>
  {% endfor %}
</div>
